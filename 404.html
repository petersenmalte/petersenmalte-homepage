<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — diverges</title>
<style>
  :root{
    --bg:#f7f4ee; --ink:#211d17; --ink-dim:#6b6558;
    --line:#ddd6c6; --accent:#b6491f; --accent-2:#2c6e64;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161310; --ink:#eee8db; --ink-dim:#a89f8c; --line:#3a3428; --accent:#e2814f; --accent-2:#6fbfb1; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
  }
  h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2rem, 8vw, 3rem);
    margin:0 0 10px 0;
  }
  p{
    font-family:var(--sans); font-size:1rem; color:var(--ink-dim);
    margin:0 0 22px 0; max-width:40ch;
  }
  .iter{
    font-family:var(--mono); font-size:0.95rem; color:var(--accent);
    min-height:1.4em; margin-bottom:28px;
    font-variant-numeric: tabular-nums;
  }
  a{
    font-family:var(--mono); font-size:0.85rem;
    color:var(--accent-2); text-decoration:none;
    border-bottom:1px solid var(--accent-2);
    padding-bottom:1px;
  }
  a:hover{ opacity:0.75; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>This page does not converge.</p>
  <div class="iter" id="iter" aria-live="polite"></div>
  <a href="/">&larr; back to regularization</a>

<script>
(function(){
  var el = document.getElementById('iter');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var steps = [
    "κ₀ = 1.000",
    "κ₁ = 3.700",
    "κ₂ = 41.200",
    "κ₃ = 968.400",
    "κ₄ = → ∞",
    "Method diverges."
  ];
  if (reduceMotion){
    el.textContent = steps[steps.length - 1];
    return;
  }
  var i = 0;
  function next(){
    el.textContent = steps[i];
    i++;
    if (i < steps.length){
      setTimeout(next, 450);
    }
  }
  next();
})();
</script>
</body>
</html>
