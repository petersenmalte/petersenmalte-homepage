<!doctype html>
<html lang="en">
<!--
  I vanish the instant this page opens its eyes.
  No visitor has ever seen me standing in the light.
  Yet I have always been exactly where you are looking right now.
  What am I?
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>petersenmalte.de</title>
<style>
  :root{
    --bg:#f7f4ee; --ink:#211d17; --ink-dim:#6b6558;
    --line:#ddd6c6; --accent:#b6491f; --accent-2:#2c6e64;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161310; --ink:#eee8db; --ink-dim:#a89f8c; --line:#3a3428; --accent:#e2814f; --accent-2:#6fbfb1; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
  }
  h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2rem, 8vw, 3.2rem);
    margin:0; min-height:1.2em;
  }
  p{
    font-family:var(--mono); font-size:0.85rem; color:var(--ink-dim);
    margin:14px 0 0 0;
  }

  footer{
    position:fixed; bottom:16px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:var(--mono); font-size:0.8rem; color:var(--ink-dim);
  }
  #sigma-sim{
    display:block; opacity:0; transition:opacity .25s;
  }
  footer:hover #sigma-sim{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #sigma-sim{ display:none; }
  }
  #falk-link{ color:inherit; text-decoration:none; transition:color .15s; }
  #falk-link:hover{ color:var(--accent-2); }
#footer-links{
  display:flex; align-items:center; gap:14px; margin-top:6px;
}
#footer-links a{
  display:flex; color:inherit;
  opacity:0.85; transition:opacity .15s, color .15s;
}
#footer-links a:hover{ opacity:1; color:var(--accent-2); }
#footer-links svg{ display:block; width:18px; height:18px; }

  /* scroll progress — exponential convergence, not linear */
  #progress-bar{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--accent); z-index:30;
  }

  /* two clocks, top right, no labels */
  #two-clocks{
    position:fixed; top:16px; right:16px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:var(--mono); font-size:0.75rem; color:var(--ink-dim);
    opacity:0.65; letter-spacing:0.02em;
    z-index:10;
  }
  #clock-times{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .moon-phase{ display:block; width:18px; height:18px; color:var(--ink-dim); }
  .moon-phase svg{ display:block; width:100%; height:100%; }
  .moon-phase__shadow{ fill:currentColor; opacity:0.2; }
  .moon-phase__light{ fill:currentColor; }
  .moon-phase__rim{ fill:none; stroke:currentColor; stroke-width:0.9; }
  @media (max-width:480px){
    #two-clocks{ top:12px; right:12px; gap:4px; }
    .moon-phase{ width:16px; height:16px; }
  }

  /* hidden console */
  #console-tab{
    position:fixed; bottom:16px; right:16px;
    font-family:var(--mono); font-size:0.8rem;
    background:var(--ink); color:var(--bg);
    padding:6px 10px; border-radius:4px;
    cursor:pointer; opacity:0.55; z-index:10;
    border:none;
  }
  #console-tab:hover{ opacity:1; }
  #console-panel{
    position:fixed; bottom:16px; right:16px;
    width:min(360px, calc(100vw - 32px));
    background:var(--ink); color:var(--bg);
    border-radius:6px; font-family:var(--mono); font-size:0.8rem;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    z-index:20; overflow:hidden;
  }
  #console-panel[hidden]{ display:none; }
  #console-log{
    max-height:220px; overflow-y:auto; padding:12px 14px 0 14px;
    text-align:left; line-height:1.5; white-space:pre-wrap; word-break:break-word;
  }
  #console-log .cmd .p{ opacity:0.6; }
  #console-form{ display:flex; align-items:center; padding:10px 14px 12px 14px; gap:6px; }
  #console-form span{ opacity:0.6; }
  #console-input{
    flex:1; background:transparent; border:none; outline:none;
    color:inherit; font-family:inherit; font-size:inherit;
  }
  #console-close{
    position:absolute; top:6px; right:8px; background:none; border:none;
    color:inherit; opacity:0.5; cursor:pointer; font-size:0.9rem;
  }
  #console-close:hover{ opacity:1; }
</style>
</head>

<script>
/* contact address, assembled at runtime instead of sitting as plain text in
   the HTML — shared by the footer icon and the console's mail fallback */
(function(){
  var user = ['p','e','t','e','r','s','e','n','-','m','a','l','t','e'].join('');
  var domain = ['g','m','x','.','n','e','t'].join('');
  window.__contactAddress = user + '@' + domain;
})();

(function(){
  var tab = document.getElementById('console-tab');
  var panel = document.getElementById('console-panel');
  var closeBtn = document.getElementById('console-close');
  var log = document.getElementById('console-log');
  var form = document.getElementById('console-form');
  var input = document.getElementById('console-input');
  var promptEl = document.getElementById('console-prompt');

  // TODO: sign up at https://formspree.io with the address this page emails
  // to, create a form there, and paste its endpoint below. Until then, the
  // mail command falls back to opening a prefilled mailto: link instead of
  // silently failing.
  var FORMSPREE_ENDPOINT = 'https://formspree.io/f/YOUR_FORM_ID';

  // the site's pages, in one place — ls, cat/open and tab-completion all
  // read from this instead of hard-coding a file list three times over
  var FILES = {
    'index.html': 'you are here',
    'education.html': 'M.Sc. Bonn — thesis on mixed finite elements',
    'work.html': 'backend engineering — more soon',
    'writing.html': 'thesis, guides, notes',
    '404.html': 'diverges on purpose',
    'robots.txt': 'not much to see'
  };

  var COMMANDS = {
    help: "Available commands: help, whoami, ls, cat <file>, mail, sudo hire --me, clear",
    whoami: "malte — mathematician (M.Sc. Bonn) & backend engineer. More soon.",
    "sudo hire --me": "[sudo] password for malte: ...not required, just send a message."
  };
  var COMMAND_NAMES = Object.keys(COMMANDS).concat(['clear', 'ls', 'cat', 'open', 'mail']);

  var history = [];
  var historyIndex = 0; // === history.length means "not currently recalling"
  var draft = '';

  // null outside the flow; while sending a message, tracks which field
  // we're collecting next and what's been typed so far
  var mailState = null;

  function printLine(text, isCmd){
    var line = document.createElement('div');
    line.style.marginBottom = '8px';
    if (isCmd){
      line.className = 'cmd';
      var p = document.createElement('span');
      p.className = 'p';
      p.textContent = promptEl.textContent + ' ';
      line.appendChild(p);
      line.appendChild(document.createTextNode(text));
    } else {
      line.textContent = text;
    }
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function setPrompt(text){
    promptEl.textContent = text;
  }

  function lsOutput(){
    return Object.keys(FILES).join('  ');
  }

  function resolveFile(arg){
    var lower = arg.toLowerCase();
    var names = Object.keys(FILES);
    for (var i = 0; i < names.length; i++){
      if (names[i].toLowerCase() === lower) return names[i];
    }
    if (lower.indexOf('.') === -1){
      var withHtml = lower + '.html';
      for (var j = 0; j < names.length; j++){
        if (names[j].toLowerCase() === withHtml) return names[j];
      }
    }
    return null;
  }

  function tryOpen(verb, arg){
    if (!arg){
      printLine(verb + ": missing file operand");
      return;
    }
    var resolved = resolveFile(arg);
    if (resolved){
      printLine('Opening ' + resolved + ' …');
      setTimeout(function(){ window.location.href = resolved; }, 320);
    } else {
      printLine(verb + ': ' + arg + ': No such file or directory');
    }
  }

  function startMail(){
    mailState = { step: 'name' };
    setPrompt('name>');
    printLine("Let's send a message — type 'cancel' anytime to stop.");
    printLine('Name:');
  }

  function cancelMail(){
    mailState = null;
    setPrompt('~$');
    printLine('Cancelled.');
  }

  function sendMail(data){
    printLine('Sending …');
    if (!FORMSPREE_ENDPOINT || FORMSPREE_ENDPOINT.indexOf('YOUR_FORM_ID') !== -1){
      var subject = encodeURIComponent('Message from petersenmalte.de');
      var body = encodeURIComponent(
        'From: ' + data.name + (data.email ? ' <' + data.email + '>' : '') +
        '\n\n' + data.message
      );
      printLine("Not wired up to send on its own yet — opening your mail client instead.");
      window.location.href = 'mailto:' + window.__contactAddress + '?subject=' + subject + '&body=' + body;
      return;
    }
    fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ name: data.name, email: data.email, message: data.message })
    }).then(function(res){
      if (res.ok){
        printLine('Sent — thanks, I will get back to you.');
      } else {
        printLine('Could not send that. Try ' + window.__contactAddress + ' directly.');
      }
    }).catch(function(){
      printLine('Could not send that. Try ' + window.__contactAddress + ' directly.');
    });
  }

  function open_(){
    panel.hidden = false;
    tab.hidden = true;
    if (log.children.length === 0){
      printLine("Welcome. Type 'help' for commands. ↑/↓ for history, Tab to complete.");
    }
    input.focus();
  }
  function close(){
    panel.hidden = true;
    tab.hidden = false;
  }

  tab.addEventListener('click', open_);
  closeBtn.addEventListener('click', close);

  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (history.length === 0) return;
      if (historyIndex === history.length){ draft = input.value; }
      historyIndex = Math.max(0, historyIndex - 1);
      input.value = history[historyIndex];
      input.setSelectionRange(input.value.length, input.value.length);
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (historyIndex >= history.length) return;
      historyIndex++;
      input.value = historyIndex === history.length ? draft : history[historyIndex];
      input.setSelectionRange(input.value.length, input.value.length);
    } else if (e.key === 'Tab'){
      e.preventDefault();
      if (mailState) return; // typing free text, not a command — nothing to complete
      var full = input.value;
      var firstSpace = full.indexOf(' ');
      if (firstSpace === -1){
        var val = full.toLowerCase();
        if (!val) return;
        var matches = COMMAND_NAMES.filter(function(c){ return c.indexOf(val) === 0; });
        if (matches.length === 1){
          input.value = matches[0];
          input.setSelectionRange(input.value.length, input.value.length);
        } else if (matches.length > 1){
          printLine(matches.join('   '));
        }
      } else {
        var verb = full.slice(0, firstSpace).toLowerCase();
        if (verb !== 'cat' && verb !== 'open') return;
        var argPrefix = full.slice(firstSpace + 1).toLowerCase();
        var fileMatches = Object.keys(FILES).filter(function(f){ return f.toLowerCase().indexOf(argPrefix) === 0; });
        if (fileMatches.length === 1){
          input.value = verb + ' ' + fileMatches[0];
          input.setSelectionRange(input.value.length, input.value.length);
        } else if (fileMatches.length > 1){
          printLine(fileMatches.join('   '));
        }
      }
    }
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = input.value.trim();

    if (mailState){
      printLine(raw || '(skipped)', true);
      history.push(raw);
      historyIndex = history.length;
      draft = '';
      input.value = '';

      if (raw.toLowerCase() === 'cancel'){
        cancelMail();
        return;
      }
      if (mailState.step === 'name'){
        if (!raw){ printLine('Name?'); return; }
        mailState.name = raw;
        mailState.step = 'email';
        setPrompt('email>');
        printLine('Email (optional — press enter to skip):');
      } else if (mailState.step === 'email'){
        mailState.email = raw;
        mailState.step = 'message';
        setPrompt('message>');
        printLine('Message:');
      } else if (mailState.step === 'message'){
        if (!raw){ printLine('Message?'); return; }
        mailState.message = raw;
        var data = mailState;
        mailState = null;
        setPrompt('~$');
        sendMail(data);
      }
      return;
    }

    if (!raw) return;
    printLine(raw, true);
    history.push(raw);
    historyIndex = history.length;
    draft = '';
    input.value = '';

    var lower = raw.toLowerCase();
    if (raw === 'clear'){
      log.innerHTML = '';
      return;
    }
    if (lower === 'ls'){
      printLine(lsOutput());
      return;
    }
    if (lower === 'mail' || lower === 'write'){
      startMail();
      return;
    }
    var firstSpace = raw.indexOf(' ');
    var verb = (firstSpace === -1 ? raw : raw.slice(0, firstSpace)).toLowerCase();
    if (verb === 'cat' || verb === 'open'){
      var arg = firstSpace === -1 ? '' : raw.slice(firstSpace + 1).trim();
      tryOpen(verb, arg);
      return;
    }

    var reply = COMMANDS[lower];
    printLine(reply || ("Command not found: " + raw + " — try 'help'"));
  });
})();

/* two clocks — Europe/Berlin and America/Toronto, no labels */
(function(){
  var el = document.getElementById('clock-times');
  if (!el) return;
  var fmtA = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
  var fmtB = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Toronto' });
  function render(){
    var now = new Date();
    el.textContent = fmtA.format(now) + "  ·  " + fmtB.format(now);
  }
  render();
  setInterval(render, 15000);
})();

/* scroll progress bar — width follows 1 - e^(-k*x), converges rather than fills linearly */
(function(){
  var bar = document.getElementById('progress-bar');
  if (!bar) return;
  function render(){
    var doc = document.documentElement;
    var scrollTop = doc.scrollTop || document.body.scrollTop;
    var scrollHeight = doc.scrollHeight - doc.clientHeight;
    var fraction = scrollHeight > 0 ? Math.min(1, scrollTop / scrollHeight) : 0;
    var k = 3.5;
    var converged = (1 - Math.exp(-k * fraction)) / (1 - Math.exp(-k));
    bar.style.width = (converged * 100) + "%";
  }
  document.addEventListener('scroll', render, { passive: true });
  window.addEventListener('resize', render);
  render();
})();

/* sigma footer mini-simulation — a small clamped elastic mesh (FEM-style), poked and
   relaxing back to equilibrium: a physical picture of div(sigma) = 0. Edges are colored
   by local stretch (tension) or compression while the mesh settles.

   Integrator: Verlet integration (implicit velocity via previous position) plus one
   Gauss-Seidel distance-constraint relaxation pass per frame — the standard, well-tested
   method behind most real-time cloth/soft-body simulations (Thomas Jakobsen,
   "Advanced Character Physics", 2001), used here instead of a hand-rolled force integrator.
   Damping is kept high (little energy loss per frame) so the settle is slow enough to
   actually see: several visible bounces over roughly two seconds. */
(function(){
  var canvas = document.getElementById('sigma-sim');
  var footer = canvas ? canvas.closest('footer') : null;
  if (!canvas || !footer) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var nx = 7, ny = 4;

  var nodes = [];
  for (var j = 0; j < ny; j++){
    for (var i = 0; i < nx; i++){
      var rx = (i / (nx - 1)) * w;
      var ry = (j / (ny - 1)) * h;
      var fixed = (i === 0 || i === nx - 1 || j === 0 || j === ny - 1);
      nodes.push({ rx: rx, ry: ry, x: rx, y: ry, px: rx, py: ry, fixed: fixed });
    }
  }
  function idx(i, j){ return j * nx + i; }

  var constraints = [];
  function addConstraint(a, b){
    var dx = nodes[b].rx - nodes[a].rx, dy = nodes[b].ry - nodes[a].ry;
    constraints.push({ a: a, b: b, rest: Math.sqrt(dx * dx + dy * dy) });
  }
  for (var j = 0; j < ny; j++){
    for (var i = 0; i < nx; i++){
      if (i < nx - 1) addConstraint(idx(i, j), idx(i + 1, j));
      if (j < ny - 1) addConstraint(idx(i, j), idx(i, j + 1));
    }
  }

  var DAMPING = 0.985;
  var STIFFNESS = 0.2;
  var RELAXATION_ITERATIONS = 1;
  var MAX_DEVIATION = 18;
  var cx = Math.floor(nx / 2), cy = Math.floor(ny / 2);
  var running = false, rafId = null;

  function pluck(){
    for (var n = 0; n < nodes.length; n++){
      nodes[n].x = nodes[n].rx; nodes[n].y = nodes[n].ry;
      nodes[n].px = nodes[n].rx; nodes[n].py = nodes[n].ry;
    }
    for (var j = 0; j < ny; j++){
      for (var i = 0; i < nx; i++){
        var d = Math.abs(i - cx) + Math.abs(j - cy);
        if (d <= 2){
          var node = nodes[idx(i, j)];
          if (!node.fixed){ node.y += (1 - d / 3) * 10; }
        }
      }
    }
  }

  function step(){
    for (var n = 0; n < nodes.length; n++){
      var node = nodes[n];
      if (node.fixed) continue;
      var vx = (node.x - node.px) * DAMPING;
      var vy = (node.y - node.py) * DAMPING;
      node.px = node.x; node.py = node.y;
      node.x += vx; node.y += vy;
    }
    for (var it = 0; it < RELAXATION_ITERATIONS; it++){
      for (var c = 0; c < constraints.length; c++){
        var con = constraints[c];
        var A = nodes[con.a], B = nodes[con.b];
        var dx = B.x - A.x, dy = B.y - A.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        var diff = ((dist - con.rest) / dist) * STIFFNESS;
        var invA = A.fixed ? 0 : 1, invB = B.fixed ? 0 : 1;
        var sum = invA + invB;
        if (sum === 0) continue;
        var wA = invA / sum, wB = invB / sum;
        var cxAdj = diff * dx, cyAdj = diff * dy;
        A.x += cxAdj * wA; A.y += cyAdj * wA;
        B.x -= cxAdj * wB; B.y -= cyAdj * wB;
      }
    }
    var maxAmp = 0;
    for (var n = 0; n < nodes.length; n++){
      var node = nodes[n];
      if (node.fixed) continue;
      var ddx = node.x - node.rx, ddy = node.y - node.ry;
      var dev = Math.hypot(ddx, ddy);
      if (dev > MAX_DEVIATION){
        var f = MAX_DEVIATION / dev;
        node.x = node.rx + ddx * f;
        node.y = node.ry + ddy * f;
        dev = MAX_DEVIATION;
      }
      if (dev > maxAmp) maxAmp = dev;
    }
    return maxAmp;
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#b6491f';
    var accent2 = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim() || '#2c6e64';
    var dim = getComputedStyle(document.documentElement).getPropertyValue('--ink-dim').trim() || '#6b6558';
    ctx.lineWidth = 1.1;
    for (var c = 0; c < constraints.length; c++){
      var con = constraints[c];
      var A = nodes[con.a], B = nodes[con.b];
      var dx = B.x - A.x, dy = B.y - A.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      var diff = dist - con.rest;
      if (diff > 0.3){ ctx.strokeStyle = accent2; }
      else if (diff < -0.3){ ctx.strokeStyle = accent; }
      else { ctx.strokeStyle = dim; }
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
    }
  }

  function loop(){
    var amp = step();
    draw();
    if (amp > 0.15){
      rafId = requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }

  function start(){
    if (running) return;
    running = true;
    if (rafId) cancelAnimationFrame(rafId);
    pluck();
    loop();
  }

  draw();
  footer.addEventListener('mouseenter', start);
  footer.addEventListener('touchstart', start, { passive: true });
})();

   script, so the two never drift apart */
(function(){
  var link = document.getElementById('contact-link');
  if (!link) return;
  link.href = 'mailto:' + window.__contactAddress;
})();
</script>
