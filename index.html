<style>
  :root{
    --bg:#f7f4ee; --ink:#211d17; --ink-dim:#6b6558;
    --line:#ddd6c6; --accent:#b6491f; --accent-2:#2c6e64;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161310; --ink:#eee8db; --ink-dim:#a89f8c; --line:#3a3428; --accent:#e2814f; --accent-2:#6fbfb1; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
  }
  h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2rem, 8vw, 3.2rem);
    margin:0; min-height:1.2em;
  }
  p{
    font-family:var(--mono); font-size:0.85rem; color:var(--ink-dim);
    margin:14px 0 0 0;
  }

  footer{
    /* Only as wide as its contents: a full-width footer would reach into the
       bottom corners and start the sigma simulation whenever the cursor came
       near the bike or the ibex. */
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    width:max-content; max-width:calc(100vw - 150px);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:var(--mono); font-size:0.8rem; color:var(--ink-dim);
  }
  #sigma-sim{
    display:block; opacity:0; transition:opacity .25s;
  }
  footer:hover #sigma-sim{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #sigma-sim{ display:none; }
  }
  #falk-link{ color:inherit; text-decoration:none; transition:color .15s; }
  #falk-link:hover{ color:var(--accent-2); }
#footer-links{
  display:flex; align-items:center; gap:14px; margin-top:6px;
}
#footer-links a{
  display:flex; color:inherit;
  opacity:0.85; transition:opacity .15s, color .15s;
}
#footer-links a:hover{ opacity:1; color:var(--accent-2); }
#footer-links svg{ display:block; width:18px; height:18px; }

  /* scroll progress — exponential convergence, not linear */
  #progress-bar{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--accent); z-index:30;
  }

  /* two clocks, top right, no labels */
  #two-clocks{
    position:fixed; top:16px; right:16px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:var(--mono); font-size:0.75rem; color:var(--ink-dim);
    opacity:0.65; letter-spacing:0.02em;
    z-index:10;
  }
  #clock-times{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .moon-phase{
    display:block; position:relative; width:18px; height:18px;
    color:var(--ink-dim); text-decoration:none; transition:color .15s;
  }
  .moon-phase:hover{ color:var(--accent-2); }
  .moon-phase svg{ display:block; width:100%; height:100%; }
  .moon-phase__shadow{ fill:currentColor; opacity:0.2; }
  .moon-phase__light{ fill:currentColor; }
  .moon-phase__rim{ fill:none; stroke:currentColor; stroke-width:0.9; }
  .moon-phase__tooltip{
    position:absolute; top:calc(100% + 6px); right:-2px;
    width:max-content; max-width:min(30ch, calc(100vw - 24px)); padding:4px 6px; border-radius:3px;
    background:var(--ink); color:var(--bg); font:inherit; line-height:1.25;
    letter-spacing:normal; opacity:0; pointer-events:none; transform:translateY(-2px); visibility:hidden;
    transition:opacity .15s, transform .15s, visibility .15s; text-align:right; z-index:11;
  }
  .moon-phase:hover .moon-phase__tooltip,
  .moon-phase:focus .moon-phase__tooltip{ opacity:1; transform:translateY(0); visibility:visible; }
  .moon-phase:focus-visible{ outline:1px solid var(--accent-2); outline-offset:4px; border-radius:50%; }
  @media (max-width:480px){
    #two-clocks{ top:12px; right:12px; gap:4px; }
    .moon-phase{ width:16px; height:16px; }
  }

  /* Ledger — public GitHub contribution analysis, vertically centered, left edge */
  #ledger-link{
    position:fixed; left:20px; top:50%; transform:translateY(-50%);
    display:block; width:20px; height:20px;
    color:var(--ink-dim); text-decoration:none; transition:color .15s;
    z-index:10;
  }
  #ledger-link:hover, #ledger-link:focus-visible{ color:var(--accent-2); }
  #ledger-link:focus-visible{ outline:1px solid var(--accent-2); outline-offset:4px; border-radius:3px; }
  #ledger-link svg{ display:block; width:100%; height:100%; }
  #ledger-link__tooltip{
    position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%) translateX(-4px);
    width:max-content; max-width:min(28ch, calc(100vw - 80px)); padding:4px 7px; border-radius:3px;
    background:var(--ink); color:var(--bg); font-family:var(--mono); font-size:0.75rem; line-height:1.3;
    opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity .15s, transform .15s, visibility .15s;
  }
  #ledger-link:hover #ledger-link__tooltip,
  #ledger-link:focus-visible #ledger-link__tooltip{
    opacity:1; transform:translateY(-50%) translateX(0); visibility:visible;
  }
  @media (max-width:480px){
    #ledger-link{ left:12px; width:18px; height:18px; }
  }

  /* Bike icon, bottom left — just the icon, nothing behind it yet */
  #bike-icon{
    position:fixed; left:20px; bottom:20px;
    display:block; width:20px; height:20px;
    color:var(--ink-dim);
    z-index:10;
  }
  #bike-icon svg{ display:block; width:100%; height:100%; }
  @media (max-width:480px){
    #bike-icon{ left:12px; bottom:12px; width:18px; height:18px; }
  }

  /* Ibex, bottom left next to the bike — hover opens a photo from the ridge above Verbier */
  #ibex{
    position:fixed; left:52px; bottom:20px;
    display:block; width:20px; height:20px; padding:0;
    background:none; border:0; cursor:pointer;
    color:var(--ink-dim); transition:color .15s;
    z-index:10;
  }
  #ibex svg{ display:block; width:100%; height:100%; }
  #ibex:hover, #ibex:focus-visible, #ibex.is-open{ color:var(--accent-2); }
  #ibex:focus-visible{ outline:1px solid var(--accent-2); outline-offset:4px; border-radius:3px; }

  #ibex-card{
    position:absolute; left:-6px; bottom:calc(100% + 10px); margin:0;
    width:clamp(180px, 42vw, 248px);
    padding:6px 6px 0; border:1px solid var(--line); border-radius:3px;
    background:var(--bg); box-shadow:0 6px 24px rgba(0,0,0,0.14);
    opacity:0; visibility:hidden; transform:translateY(4px);
    transition:opacity .2s, transform .2s, visibility .2s;
    pointer-events:none;
  }
  #ibex-card img{
    display:block; width:100%; height:auto; aspect-ratio:3/4;
    object-fit:cover; border-radius:2px;
  }
  #ibex-card figcaption{
    font-family:var(--mono); font-size:0.68rem; line-height:1.35;
    color:var(--ink-dim); text-align:left; padding:6px 2px 7px;
  }
  #ibex:hover #ibex-card,
  #ibex:focus-visible #ibex-card,
  #ibex.is-open #ibex-card{
    opacity:1; visibility:visible; transform:translateY(0);
  }
  @media (prefers-reduced-motion: reduce){
    #ibex-card{ transition:none; transform:none; }
  }
  @media (max-width:480px){
    #ibex{ left:38px; bottom:12px; width:18px; height:18px; }
  }

<script>
/* two clocks — Europe/Berlin and America/Toronto, no labels */
(function(){
  var el = document.getElementById('clock-times');
  if (!el) return;
  var fmtA = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Berlin' });
  var fmtB = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'America/Toronto' });
  function render(){
    var now = new Date();
    el.textContent = fmtA.format(now) + "  ·  " + fmtB.format(now);
  }
  render();
  setInterval(render, 1000);
})();

/* scroll progress bar — width follows 1 - e^(-k*x), converges rather than fills linearly */
(function(){
  var bar = document.getElementById('progress-bar');
  if (!bar) return;
  function render(){
    var doc = document.documentElement;
    var scrollTop = doc.scrollTop || document.body.scrollTop;
    var scrollHeight = doc.scrollHeight - doc.clientHeight;
    var fraction = scrollHeight > 0 ? Math.min(1, scrollTop / scrollHeight) : 0;
    var k = 3.5;
    var converged = (1 - Math.exp(-k * fraction)) / (1 - Math.exp(-k));
    bar.style.width = (converged * 100) + "%";
  }
  document.addEventListener('scroll', render, { passive: true });
  window.addEventListener('resize', render);
  render();
})();

/* sigma footer mini-simulation — a small clamped elastic mesh (FEM-style), poked and
   relaxing back to equilibrium: a physical picture of div(sigma) = 0. Edges are colored
   by local stretch (tension) or compression while the mesh settles.

   Integrator: Verlet integration (implicit velocity via previous position) plus one
   Gauss-Seidel distance-constraint relaxation pass per frame — the standard, well-tested
   method behind most real-time cloth/soft-body simulations (Thomas Jakobsen,
   "Advanced Character Physics", 2001), used here instead of a hand-rolled force integrator.
   Damping is kept high (little energy loss per frame) so the settle is slow enough to
   actually see: several visible bounces over roughly two seconds. */
(function(){
  var canvas = document.getElementById('sigma-sim');
  var footer = canvas ? canvas.closest('footer') : null;
  if (!canvas || !footer) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var nx = 7, ny = 4;

  var nodes = [];
  for (var j = 0; j < ny; j++){
    for (var i = 0; i < nx; i++){
      var rx = (i / (nx - 1)) * w;
      var ry = (j / (ny - 1)) * h;
      var fixed = (i === 0 || i === nx - 1 || j === 0 || j === ny - 1);
      nodes.push({ rx: rx, ry: ry, x: rx, y: ry, px: rx, py: ry, fixed: fixed });
    }
  }
  function idx(i, j){ return j * nx + i; }

  var constraints = [];
  function addConstraint(a, b){
    var dx = nodes[b].rx - nodes[a].rx, dy = nodes[b].ry - nodes[a].ry;
    constraints.push({ a: a, b: b, rest: Math.sqrt(dx * dx + dy * dy) });
  }
  for (var j = 0; j < ny; j++){
    for (var i = 0; i < nx; i++){
      if (i < nx - 1) addConstraint(idx(i, j), idx(i + 1, j));
      if (j < ny - 1) addConstraint(idx(i, j), idx(i, j + 1));
    }
  }

  var DAMPING = 0.985;
  var STIFFNESS = 0.2;
  var RELAXATION_ITERATIONS = 1;
  var MAX_DEVIATION = 18;
  var cx = Math.floor(nx / 2), cy = Math.floor(ny / 2);
  var running = false, rafId = null;

  function pluck(){
    for (var n = 0; n < nodes.length; n++){
      nodes[n].x = nodes[n].rx; nodes[n].y = nodes[n].ry;
      nodes[n].px = nodes[n].rx; nodes[n].py = nodes[n].ry;
    }
    for (var j = 0; j < ny; j++){
      for (var i = 0; i < nx; i++){
        var d = Math.abs(i - cx) + Math.abs(j - cy);
        if (d <= 2){
          var node = nodes[idx(i, j)];
          if (!node.fixed){ node.y += (1 - d / 3) * 10; }
        }
      }
    }
  }

  function step(){
    for (var n = 0; n < nodes.length; n++){
      var node = nodes[n];
      if (node.fixed) continue;
      var vx = (node.x - node.px) * DAMPING;
      var vy = (node.y - node.py) * DAMPING;
      node.px = node.x; node.py = node.y;
      node.x += vx; node.y += vy;
    }
    for (var it = 0; it < RELAXATION_ITERATIONS; it++){
      for (var c = 0; c < constraints.length; c++){
        var con = constraints[c];
        var A = nodes[con.a], B = nodes[con.b];
        var dx = B.x - A.x, dy = B.y - A.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        var diff = ((dist - con.rest) / dist) * STIFFNESS;
        var invA = A.fixed ? 0 : 1, invB = B.fixed ? 0 : 1;
        var sum = invA + invB;
        if (sum === 0) continue;
        var wA = invA / sum, wB = invB / sum;
        var cxAdj = diff * dx, cyAdj = diff * dy;
        A.x += cxAdj * wA; A.y += cyAdj * wA;
        B.x -= cxAdj * wB; B.y -= cyAdj * wB;
      }
    }
    var maxAmp = 0;
    for (var n = 0; n < nodes.length; n++){
      var node = nodes[n];
      if (node.fixed) continue;
      var ddx = node.x - node.rx, ddy = node.y - node.ry;
      var dev = Math.hypot(ddx, ddy);
      if (dev > MAX_DEVIATION){
        var f = MAX_DEVIATION / dev;
        node.x = node.rx + ddx * f;
        node.y = node.ry + ddy * f;
        dev = MAX_DEVIATION;
      }
      if (dev > maxAmp) maxAmp = dev;
    }
    return maxAmp;
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#b6491f';
    var accent2 = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim() || '#2c6e64';
    var dim = getComputedStyle(document.documentElement).getPropertyValue('--ink-dim').trim() || '#6b6558';
    ctx.lineWidth = 1.1;
    for (var c = 0; c < constraints.length; c++){
      var con = constraints[c];
      var A = nodes[con.a], B = nodes[con.b];
      var dx = B.x - A.x, dy = B.y - A.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      var diff = dist - con.rest;
      if (diff > 0.3){ ctx.strokeStyle = accent2; }
      else if (diff < -0.3){ ctx.strokeStyle = accent; }
      else { ctx.strokeStyle = dim; }
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
    }
  }

  function loop(){
    var amp = step();
    draw();
    if (amp > 0.15){
      rafId = requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }

  function start(){
    if (running) return;
    running = true;
    if (rafId) cancelAnimationFrame(rafId);
    pluck();
    loop();
  }

  draw();
  footer.addEventListener('mouseenter', start);
  footer.addEventListener('touchstart', start, { passive: true });
})();

/* ibex — hover opens the photo card on pointer devices; tap toggles it on touch */
(function(){
  var ibex = document.getElementById('ibex');
  if (!ibex) return;
  function setOpen(open){
    ibex.classList.toggle('is-open', open);
    ibex.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  ibex.addEventListener('click', function(){
    setOpen(!ibex.classList.contains('is-open'));
  });
  ibex.addEventListener('blur', function(){ setOpen(false); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') setOpen(false);
  });
  document.addEventListener('click', function(e){
    if (!ibex.contains(e.target)) setOpen(false);
  });
})();

   text in the HTML, to deter the simplest source-scraping spam bots */

  if (!link) return;
  var user = ['p','e','t','e','r','s','e','n','-','m','a','l','t','e'].join('');
  var domain = ['g','m','x','.','n','e','t'].join('');
  link.href = 'mailto:' + user + '@' + domain;
})();
