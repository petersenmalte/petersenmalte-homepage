<!doctype html>
<html lang="de">
<!--
  Ich bin ein Tensor, kein Skalar.
  Ich messe Zug und Druck zugleich, an jedem Punkt, in jede Richtung.
  Meine Divergenz verschwindet dort, wo alles im Gleichgewicht ruht.
  Ich stehe schon am Ende dieser Seite — du musst mich nur noch erkennen.
  Was bin ich?
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>petersenmalte.de</title>
<style>
  :root{
    --bg:#f7f4ee; --ink:#211d17; --ink-dim:#6b6558;
    --line:#ddd6c6; --accent:#b6491f; --accent-2:#2c6e64;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Fraunces",Georgia,serif;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161310; --ink:#eee8db; --ink-dim:#a89f8c; --line:#3a3428; --accent:#e2814f; --accent-2:#6fbfb1; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
  }
  h1{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2rem, 8vw, 3.2rem);
    margin:0; min-height:1.2em;
    transition:color .3s;
  }
  p{
    font-family:var(--mono); font-size:0.85rem; color:var(--ink-dim);
    margin:14px 0 0 0;
  }
  #hint{
    font-family:var(--mono); font-size:0.72rem; color:var(--ink-dim);
    margin-top:6px; opacity:0; transition:opacity .4s;
  }
  #hint.show{ opacity:0.7; }

  footer{
    position:fixed; bottom:16px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:var(--mono); font-size:0.8rem; color:var(--ink-dim);
  }
  #sigma-sim{
    display:block; opacity:0; transition:opacity .25s;
  }
  footer:hover #sigma-sim{ opacity:1; }
  @media (prefers-reduced-motion: reduce){
    #sigma-sim{ display:none; }
  }

  @keyframes shake{
    0%{transform:translate(0,0);}
    10%{transform:translate(-6px,2px);}
    20%{transform:translate(5px,-3px);}
    30%{transform:translate(-4px,4px);}
    40%{transform:translate(6px,-2px);}
    50%{transform:translate(-3px,3px);}
    60%{transform:translate(4px,-4px);}
    70%{transform:translate(-5px,2px);}
    80%{transform:translate(3px,-3px);}
    90%{transform:translate(-2px,1px);}
    100%{transform:translate(0,0);}
  }
  body.konami{ animation:shake 0.6s ease; }
  body.konami h1{ color:var(--accent); }
  @media (prefers-reduced-motion: reduce){
    body.konami{ animation:none; }
  }

  /* scroll progress — exponential convergence, not linear */
  #progress-bar{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:var(--accent); z-index:30;
  }

  /* two clocks, top right, no labels */
  #two-clocks{
    position:fixed; top:16px; right:16px;
    font-family:var(--mono); font-size:0.75rem; color:var(--ink-dim);
    opacity:0.65; letter-spacing:0.02em;
    z-index:10;
  }

  /* hidden console */
  #console-tab{
    position:fixed; bottom:16px; right:16px;
    font-family:var(--mono); font-size:0.8rem;
    background:var(--ink); color:var(--bg);
    padding:6px 10px; border-radius:4px;
    cursor:pointer; opacity:0.55; z-index:10;
    border:none;
  }
  #console-tab:hover{ opacity:1; }
  #console-panel{
    position:fixed; bottom:16px; right:16px;
    width:min(360px, calc(100vw - 32px));
    background:var(--ink); color:var(--bg);
    border-radius:6px; font-family:var(--mono); font-size:0.8rem;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    z-index:20; overflow:hidden;
  }
  #console-panel[hidden]{ display:none; }
  #console-log{
    max-height:220px; overflow-y:auto; padding:12px 14px 0 14px;
    text-align:left; line-height:1.5; white-space:pre-wrap; word-break:break-word;
  }
  #console-log .cmd::before{ content:"~$ "; opacity:0.6; }
  #console-form{ display:flex; align-items:center; padding:10px 14px 12px 14px; gap:6px; }
  #console-form span{ opacity:0.6; }
  #console-input{
    flex:1; background:transparent; border:none; outline:none;
    color:inherit; font-family:inherit; font-size:inherit;
  }
  #console-close{
    position:absolute; top:6px; right:8px; background:none; border:none;
    color:inherit; opacity:0.5; cursor:pointer; font-size:0.9rem;
  }
  #console-close:hover{ opacity:1; }
</style>
</head>
<body>
  <div id="progress-bar"></div>
  <div id="two-clocks"></div>

  <h1 class="scramble" data-text="Malte Petersen"></h1>
  <p>Seite im Aufbau.</p>
  <div id="hint"></div>

  <footer>
    <canvas id="sigma-sim" width="160" height="28" aria-hidden="true"></canvas>
    <div>&#8711;&middot;&sigma; = 0</div>
  </footer>

  <button id="console-tab" type="button">~$</button>
  <div id="console-panel" hidden>
    <button id="console-close" type="button" aria-label="Konsole schließen">&times;</button>
    <div id="console-log"></div>
    <form id="console-form">
      <span>~$</span>
      <input id="console-input" type="text" autocomplete="off" spellcheck="false" aria-label="Befehl eingeben">
    </form>
  </div>

<script>
(function(){
  var CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scramble(el, text, duration){
    if (reduceMotion){ el.textContent = text; return; }
    var frame = 0;
    var totalFrames = Math.round(duration / 30);
    var resolved = new Array(text.length).fill(false);
    var timer = setInterval(function(){
      frame++;
      var out = "";
      for (var i = 0; i < text.length; i++){
        if (text[i] === " "){ out += " "; continue; }
        var revealAt = (i / text.length) * totalFrames * 0.7;
        if (frame >= revealAt + totalFrames * 0.3){ resolved[i] = true; }
        out += resolved[i] ? text[i] : CHARS[Math.floor(Math.random() * CHARS.length)];
      }
      el.textContent = out;
      if (frame >= totalFrames){
        clearInterval(timer);
        el.textContent = text;
      }
    }, 30);
  }
  var el = document.querySelector('.scramble');
  if (el){
    var text = el.getAttribute('data-text') || '';
    setTimeout(function(){ scramble(el, text, 700); }, 150);
  }

  window._scrambleTitle = function(text, duration){ scramble(el, text, duration); };
})();

(function(){
  var tab = document.getElementById('console-tab');
  var panel = document.getElementById('console-panel');
  var closeBtn = document.getElementById('console-close');
  var log = document.getElementById('console-log');
  var form = document.getElementById('console-form');
  var input = document.getElementById('console-input');

  var COMMANDS = {
    help: "Verfügbare Befehle: help, whoami, ls, cat masterarbeit.pdf, sudo hire --me, clear",
    whoami: "malte — Mathematiker (M.Sc. Bonn) & Backend-Engineer. Mehr Infos: bald hier.",
    ls: "index.html  404.html  robots.txt  (der Rest kommt noch)",
    "cat masterarbeit.pdf": "Postprocessing gemischter elastischer Eigenwerte — Note 1,3. Volltext folgt an dieser Stelle.",
    "sudo hire --me": "[sudo] password for malte: ...nicht nötig, einfach eine Nachricht schreiben."
  };

  function printLine(text, isCmd){
    var line = document.createElement('div');
    if (isCmd){ line.className = 'cmd'; }
    line.textContent = text;
    line.style.marginBottom = '8px';
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function open(){
    panel.hidden = false;
    tab.hidden = true;
    if (log.children.length === 0){
      printLine("Willkommen. Tippe 'help' für Befehle.");
    }
    input.focus();
  }
  function close(){
    panel.hidden = true;
    tab.hidden = false;
  }

  tab.addEventListener('click', open);
  closeBtn.addEventListener('click', close);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var raw = input.value.trim();
    if (!raw) return;
    printLine(raw, true);
    if (raw === 'clear'){
      log.innerHTML = '';
    } else {
      var reply = COMMANDS[raw.toLowerCase()];
      printLine(reply || ("Befehl nicht gefunden: " + raw + " — versuch's mit 'help'"));
    }
    input.value = '';
  });

  window._consoleAnnounce = function(text){
    if (!panel.hidden){ printLine(text); }
  };
})();

(function(){
  var SEQUENCE = ["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
  var buffer = [];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hint = document.getElementById('hint');

  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    buffer.push(key);
    if (buffer.length > SEQUENCE.length){ buffer.shift(); }
    if (buffer.length === SEQUENCE.length && buffer.every(function(k, i){ return k === SEQUENCE[i]; })){
      triggerKonami();
      buffer = [];
    }
  });

  function triggerKonami(){
    document.body.classList.add('konami');
    setTimeout(function(){ document.body.classList.remove('konami'); }, 650);

    if (window._scrambleTitle){
      window._scrambleTitle("Resonanzkatastrophe", reduceMotion ? 1 : 500);
      setTimeout(function(){
        window._scrambleTitle("Malte Petersen", reduceMotion ? 1 : 600);
      }, 1000);
    }

    hint.textContent = "κ → ∞ — Verfahren stabilisiert sich wieder.";
    hint.classList.add('show');
    setTimeout(function(){ hint.classList.remove('show'); }, 2200);

    if (window._consoleAnnounce){
      window._consoleAnnounce("[system] Konami-Code erkannt — Resonanzkatastrophe simuliert.");
    }
  }
})();

/* two clocks — Europe/Berlin and America/Toronto, no labels */
(function(){
  var el = document.getElementById('two-clocks');
  if (!el) return;
  var fmtA = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
  var fmtB = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Toronto' });
  function render(){
    var now = new Date();
    el.textContent = fmtA.format(now) + "  ·  " + fmtB.format(now);
  }
  render();
  setInterval(render, 15000);
})();

/* scroll progress bar — width follows 1 - e^(-k*x), converges rather than fills linearly */
(function(){
  var bar = document.getElementById('progress-bar');
  if (!bar) return;
  function render(){
    var doc = document.documentElement;
    var scrollTop = doc.scrollTop || document.body.scrollTop;
    var scrollHeight = doc.scrollHeight - doc.clientHeight;
    var fraction = scrollHeight > 0 ? Math.min(1, scrollTop / scrollHeight) : 0;
    var k = 3.5;
    var converged = (1 - Math.exp(-k * fraction)) / (1 - Math.exp(-k));
    bar.style.width = (converged * 100) + "%";
  }
  document.addEventListener('scroll', render, { passive: true });
  window.addEventListener('resize', render);
  render();
})();

/* sigma footer mini-simulation — damped mass-spring chain, clamped ends, settles to ∇·σ=0 */
(function(){
  var canvas = document.getElementById('sigma-sim');
  var footer = canvas ? canvas.closest('footer') : null;
  if (!canvas || !footer) return;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) return;

  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height, mid = h / 2;
  var n = 24;
  var y = new Array(n).fill(0);
  var v = new Array(n).fill(0);
  var k = 0.15;
  var damping = 0.90;
  var running = false;
  var rafId = null;

  function pluck(){
    for (var i = 0; i < n; i++){ y[i] = 0; v[i] = 0; }
    var c = Math.floor(n / 2);
    y[c] = h * 0.4;
    y[c - 1] = h * 0.22;
    y[c + 1] = h * 0.22;
  }

  function step(){
    var newY = y.slice();
    for (var i = 1; i < n - 1; i++){
      var force = k * ((y[i - 1] - y[i]) + (y[i + 1] - y[i]));
      v[i] = (v[i] + force) * damping;
      newY[i] = y[i] + v[i];
    }
    y = newY;
    y[0] = 0; y[n - 1] = 0;
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#b6491f';
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = 0; i < n; i++){
      var x = (i / (n - 1)) * w;
      var yy = mid - y[i];
      if (i === 0){ ctx.moveTo(x, yy); } else { ctx.lineTo(x, yy); }
    }
    ctx.stroke();
  }

  function loop(){
    step();
    draw();
    var amp = 0;
    for (var i = 0; i < n; i++){ amp = Math.max(amp, Math.abs(y[i])); }
    if (amp > 0.25){
      rafId = requestAnimationFrame(loop);
    } else {
      running = false;
      y = y.map(function(){ return 0; });
      draw();
    }
  }

  function start(){
    if (running) return;
    running = true;
    if (rafId) cancelAnimationFrame(rafId);
    pluck();
    loop();
  }

  draw();
  footer.addEventListener('mouseenter', start);
  footer.addEventListener('touchstart', start, { passive: true });
})();
</script>
</body>
</html>
